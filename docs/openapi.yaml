openapi: 3.1.0
info:
  title: Kavach HTTP API
  version: 0.1.0-dev
  summary: Decision governance and agent authorization (pre-alpha).
  description: |
    The HTTP API of `kavach-api`, on its three listeners:

    - **operator**: decision evaluation, governance, change requests,
      evidence reads and administration;
    - **agent**: the agent data plane (`/v1/authorize`, `/v1/tools/{tool}`);
    - **system of record (SoR)**: signed events that issue mandates.

    Each path lists the listeners that serve it in `x-kavach-listeners`
    (the operator listener when absent).

    This file is written by hand and held to the server by contract tests:
    every response the integration tests see is validated against it
    (`crates/kavach-api/tests/contract`), and a drift test compares its
    paths with the routers. The API does not serve it. gRPC is not covered.

    ## Errors

    Every refusal is an RFC 9457 problem (`application/problem+json`), see
    the `Problem` schema. `type` is a relative URI, `/problems/<code>`: valid
    under RFC 9457, but **not meant to be dereferenced yet**. The stable,
    machine-readable field is `code`. A 5xx `detail` is generic on purpose:
    quote the `request_id` (also the `x-request-id` header) when reporting
    it. `error` repeats `detail` for older clients and stays through v0.1.

    A BLOCK or HUMAN_REVIEW is not a problem: it is a 200 reply with reasons.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: operator listener (kavach dev up default)
tags:
  - name: operator
  - name: governance
  - name: change-requests
  - name: evidence
  - name: agents
  - name: admin
  - name: development
  - name: agent
  - name: sor
  - name: console-auth
security:
  - operatorToken: []
  - clientCertificate: []
  - consoleSession: []

paths:
  /health:
    x-kavach-listeners: [operator, agent]
    get:
      operationId: getHealth
      tags: [operator, agent]
      summary: Liveness (operator and agent listeners).
      security: []
      responses:
        "200":
          description: The listener is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /metrics:
    get:
      operationId: getMetrics
      tags: [operator]
      summary: Prometheus metrics.
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/evaluate:
    post:
      operationId: evaluate
      tags: [operator]
      summary: Evaluate one decision under the active pack and model.
      description: |
        With an HMAC secret configured, the request must also carry
        `X-Kavach-Signature`, `X-Kavach-Timestamp` and `X-Kavach-Nonce`
        (HMAC v2 over timestamp, nonce, method, path and body).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateRequest" }
      responses:
        "200":
          description: The decision (BLOCK and HUMAN_REVIEW included).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/runtime:
    get:
      operationId: getRuntime
      tags: [governance]
      summary: The active pack, model and runtime state.
      responses:
        "200":
          description: Runtime view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/packs:
    get:
      operationId: listPacks
      tags: [governance]
      summary: Policy packs known to the deployment.
      responses:
        "200":
          description: Pack summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PackSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/packs/{pack_id}:
    get:
      operationId: getPack
      tags: [governance]
      summary: One policy pack.
      parameters:
        - { name: pack_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPack" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/models:
    get:
      operationId: listModels
      tags: [governance]
      summary: Model records known to the deployment.
      responses:
        "200":
          description: Model summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/models/{model_id}:
    get:
      operationId: getModel
      tags: [governance]
      summary: One model record, with its governed status.
      parameters:
        - { name: model_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/change-requests:
    post:
      operationId: proposeChange
      tags: [change-requests]
      summary: Propose a governance change (maker-checker, ADR-009).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeProposal" }
      responses:
        "201":
          description: The pending change request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listChangeRequests
      tags: [change-requests]
      summary: List change requests, newest first.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ChangeStatus" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Change requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/change-requests/{id}:
    get:
      operationId: getChangeRequest
      tags: [change-requests]
      summary: One change request.
      parameters:
        - { $ref: "#/components/parameters/ChangeId" }
      responses:
        "200":
          description: The change request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/change-requests/{id}/approve:
    post:
      operationId: approveChange
      tags: [change-requests]
      summary: Approve and apply a change (a principal other than the proposer).
      parameters:
        - { $ref: "#/components/parameters/ChangeId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [change_digest]
              properties:
                change_digest:
                  type: string
                  description: The digest shown at proposal, echoed back.
      responses:
        "200":
          description: The decided change request (`applied` or `failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/change-requests/{id}/reject:
    post:
      operationId: rejectChange
      tags: [change-requests]
      summary: Reject a pending change.
      parameters:
        - { $ref: "#/components/parameters/ChangeId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: [string, "null"] }
      responses:
        "200":
          description: The rejected change request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/change-requests/{id}/cancel:
    post:
      operationId: cancelChange
      tags: [change-requests]
      summary: Cancel a pending change (its proposer).
      parameters:
        - { $ref: "#/components/parameters/ChangeId" }
      responses:
        "200":
          description: The cancelled change request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/admin/audit:
    get:
      operationId: listAudit
      tags: [admin]
      summary: The audit log, newest first.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/dev/clock:
    post:
      operationId: setDevClock
      tags: [development]
      summary: Move a fixed development clock forward (development stacks only).
      description: |
        Exists only on a stack started with a fixed development clock
        (`kavach dev up --clock`); otherwise 404, before authentication.
        Forward only; audited (`dev_clock_set`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [at]
              properties:
                at: { type: string, format: date-time }
      responses:
        "200":
          description: The clock after the move.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevClock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/agent-decisions/{record_id}:
    get:
      operationId: getAgentDecision
      tags: [evidence]
      summary: One agent decision record and its outcome (admins; audited).
      parameters:
        - name: record_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: "^adr:[A-Za-z0-9._-]+:[0-9]{1,9}:[0-9]{1,19}$"
      responses:
        "200":
          description: The signed record and, if any, its signed outcome.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [record, outcome]
                properties:
                  record: { $ref: "#/components/schemas/AgentDecisionRecord" }
                  outcome:
                    oneOf:
                      - { $ref: "#/components/schemas/OutcomeRecord" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/agent-revocations/{system}/{event_id}:
    get:
      operationId: getRevocationRecord
      tags: [evidence]
      summary: The evidence record of a revocation by a system-of-record event (admins; audited).
      description: >-
        ADR-012 §7. The signed `mandate_revocation` record the event produced, if one was
        written. It names the loan only by a keyed pseudonym. Same protections as agent
        decision records: `read_evidence`, a rate limit, and an audit entry before anything
        is returned.
      parameters:
        - name: system
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
        - name: event_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
      responses:
        "200":
          description: The signed revocation record.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [record]
                properties:
                  record: { $ref: "#/components/schemas/RevocationRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: The tenant's agents and their states (admins).
      description: >-
        ADR-013. Every agent a passport names in this tenant, in ascending agent-id order, a
        page at a time: pass `next_cursor` back as `cursor` for the next page. `next_cursor` is
        null when no more agents follow; a page may be short, or the last page empty, when it
        is not. With `state`, only agents in that state. 404 when agent surfaces are not
        configured.
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/AgentStateName" }
        - { $ref: "#/components/parameters/Limit" }
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
      responses:
        "200":
          description: A page of agents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStatePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/agents/{agent_id}:
    get:
      operationId: getAgentState
      tags: [agents]
      summary: An agent's state (admins).
      description: >-
        ADR-013. `active` for an agent whose state was never changed. The agent id must be
        one a passport names, exactly: any other id is a 404.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The agent's state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStateView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/agents/{agent_id}/restrict:
    post:
      operationId: restrictAgent
      tags: [agents]
      summary: Restrict an agent (`stop_agent`; one principal; only ever tightens).
      description: >-
        ADR-013 §2. A restricted agent may read within its mandate and do nothing with an
        external effect. Takes effect from its next call, on every replica.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StopAgentRequest" } } } }
      responses: &stopResponses
        "200":
          description: >-
            The agent's state now. `applied` is false when it was already in that state (the
            same stop again is not a change).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStopResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/reconciliation/closed-records:
    post:
      operationId: reconcileClosedRecords
      tags: [agents]
      summary: Find live authority for loans the lender reports closed (`reconcile_closed_records`; reports only).
      description: >-
        ADR-012 addendum (snapshot reconciliation). The lender lists the loans it considers
        paid or disputed; Kavach returns the live mandates it still holds for them. A
        `should_have_been_revoked` finding means a payment or dispute event did not arrive:
        resend the signed event (it revokes through the normal path) or stop the agent. **This
        call revokes nothing.** `issued_after_closure` is information (usually a new default).
        Loans are named by reference only. Rate limited; every run is audited (counts, never
        references).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClosedRecordsRequest" } } } }
      responses:
        "200":
          description: What was found. `mismatches` is the number of `should_have_been_revoked` findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClosedRecordsResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/agents/{agent_id}/quarantine:
    post:
      operationId: quarantineAgent
      tags: [agents]
      summary: Quarantine an agent (`stop_agent`; one principal; only ever tightens).
      description: >-
        ADR-013 §2. A quarantined agent does nothing, and the mandates it holds (and those
        delegated from them) are suspended, not revoked: reinstating restores them.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StopAgentRequest" } } } }
      responses: *stopResponses

  /v1/agents/{agent_id}/revoke:
    post:
      operationId: revokeAgent
      tags: [agents]
      summary: Revoke an agent (`stop_agent`; one principal; permanent).
      description: >-
        ADR-013 §2. The agent's state becomes `revoked`, then the mandates it holds are
        revoked (reason `manual`, delegations included). A repeat finishes a sweep that
        stopped half-way. A revoked agent cannot be reinstated, issued or delegated a
        mandate: a new passport with a new agent id is the way back.
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StopAgentRequest" } } } }
      responses: *stopResponses

  /v1/decision-events/{evidence_id}:
    get:
      operationId: getDecisionEvent
      tags: [evidence]
      summary: One evaluate decision event (admins; audited).
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: |
            The event. When `tombstoned`, it is the redacted form (reasons,
            hits and PII tokens emptied; idempotency key removed; ids
            `ERASED`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [event, tombstoned]
                properties:
                  event: { $ref: "#/components/schemas/DecisionEvent" }
                  tombstoned: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/admin/retention:
    get:
      operationId: getRetention
      tags: [admin]
      summary: Evidence retention settings.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/admin/tombstones:
    get:
      operationId: listTombstones
      tags: [admin]
      summary: Erased or expired evidence, newest first.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Tombstones.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TombstoneRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/admin/incidents:
    get:
      operationId: listIncidents
      tags: [admin]
      summary: Policy incidents, newest first.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Incidents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidentRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/admin/batch-jobs:
    get:
      operationId: listBatchJobs
      tags: [admin]
      summary: Batch jobs, newest first.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Batch jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BatchJobRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/admin/batch-jobs/{job_id}:
    get:
      operationId: getBatchJob
      tags: [admin]
      summary: One batch job.
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchJobRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/authorize:
    x-kavach-listeners: [agent]
    servers:
      - url: http://127.0.0.1:8091
        description: agent listener
    post:
      operationId: authorizeTool
      tags: [agent]
      summary: Pre-check a tool call (authorizes nothing, records nothing).
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool, mandate_id, request_id]
              properties:
                tool: { type: string }
                mandate_id: { type: string }
                request_id: { $ref: "#/components/schemas/RequestId" }
                params: { type: object }
      responses:
        "200":
          description: What a call would be decided as now.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [decision, reasons, precheck]
                properties:
                  decision: { $ref: "#/components/schemas/Decision" }
                  reasons: { type: array, items: { type: string } }
                  precheck: { const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tools/{tool}:
    x-kavach-listeners: [agent]
    servers:
      - url: http://127.0.0.1:8091
        description: agent listener
    post:
      operationId: callTool
      tags: [agent]
      summary: Call a registered tool through the gateway.
      description: |
        Authorized, recorded, forwarded at most once with a one-request
        credential; the reply never carries the destination or credential.
        A `request_id` reused with the same content returns the stored reply.
      security:
        - agentToken: []
      parameters:
        - { name: tool, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mandate_id, request_id]
              properties:
                mandate_id: { type: string }
                request_id: { $ref: "#/components/schemas/RequestId" }
                params: { type: object }
      responses:
        "200":
          description: The decision and, if forwarded, the outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayReply" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "501": { $ref: "#/components/responses/NotForwardable" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/sor/events:
    x-kavach-listeners: [sor]
    servers:
      - url: http://127.0.0.1:8090
        description: system-of-record listener (backend network only)
    post:
      operationId: submitSorEvent
      tags: [sor]
      summary: Submit a signed system-of-record event; issues one mandate, or (loan.paid, loan.disputed) revokes a loan's mandates.
      description: |
        Not authenticated by a token: the event is a compact JWS signed by
        a trusted SoR key, and the listener belongs on the backend network.
        Size- and rate-limited; idempotent per event.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event]
              properties:
                event: { type: string, description: A compact JWS. }
      responses:
        "201":
          description: A mandate was issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SorEventResponse" }
        "200":
          description: |
            The same issuing event again (the mandate it issued), or a revoking
            event (`loan.paid`, `loan.disputed`; ADR-012): the mandates it
            revoked, delegations included. A revoking event again returns the
            same list with `replayed: true`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SorEventResponse" }
                  - { $ref: "#/components/schemas/SorRevocationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/config:
    get:
      operationId: getConsoleAuthConfig
      tags: [console-auth]
      summary: What the console sign-in screen offers (ADR-018).
      security: []
      responses:
        "200":
          description: |
            `login_configured`: console sign-in through the identity
            provider is configured. `pasted_token_allowed`: the
            development-only pasted-token sign-in is offered; true only when
            login is not configured and the server runs with `--insecure-dev`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleAuthConfig" }

  /auth/login:
    get:
      operationId: consoleLogin
      tags: [console-auth]
      summary: Starts a console sign-in (authorization code with PKCE).
      description: |
        Redirects to the identity provider's authorization endpoint and sets
        the login cookie `__Host-kavach_login` (HttpOnly; Secure;
        SameSite=Lax; Path=/; Max-Age=600). On refusal it redirects to
        `/signin?error=<code>` (`sessions_full`, `login_unavailable`).
      security: []
      responses:
        "303":
          $ref: "#/components/responses/ConsoleRedirect"

  /auth/callback:
    get:
      operationId: consoleLoginCallback
      tags: [console-auth]
      summary: The identity provider's redirect back (ADR-018).
      description: |
        Needs the login cookie. On success it sets the session cookie
        `__Host-kavach_session` (HttpOnly; Secure; SameSite=Strict; Path=/;
        no Domain), expires the login cookie and redirects to `/`. On any
        failure it creates no session, expires the login cookie and
        redirects to `/signin?error=<code>` (`login_failed`,
        `login_expired`, `sessions_full`, `login_unavailable`).
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303":
          $ref: "#/components/responses/ConsoleRedirect"

  /auth/session:
    get:
      operationId: getConsoleSession
      tags: [console-auth]
      summary: Who is signed in to the console, and until when. Never a token.
      description: |
        Needs the session cookie and `X-Kavach-Console: 1`. A cookie sent
        with `Authorization` or `X-Kavach-Principal` is a 400; a missing
        console header, or a cross-site `Origin` or `Sec-Fetch-Site`, is a
        403. A 401 means the session has ended.
      security:
        - consoleSession: []
      parameters:
        - $ref: "#/components/parameters/ConsoleHeader"
      responses:
        "200":
          description: The live session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/logout:
    post:
      operationId: consoleLogout
      tags: [console-auth]
      summary: Ends the console session.
      description: |
        Same checks as `GET /auth/session`. Ends the session, revokes its
        refresh token at the identity provider (when it has a revocation
        endpoint) and expires both cookies, also on a 4xx.
        `end_session_url` is the identity provider's end-session URL when
        IdP logout is configured, else null; it never carries
        `id_token_hint`.
      security:
        - consoleSession: []
      parameters:
        - $ref: "#/components/parameters/ConsoleHeader"
      responses:
        "200":
          description: The session has ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleLogout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An OIDC access token for the operator audience (ADR-008).
    clientCertificate:
      type: mutualTLS
      description: A client certificate whose SAN is the principal (`--mtls-principal-san`).
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An agent access token (agent audience); operator tokens are refused.
    consoleSession:
      type: apiKey
      in: cookie
      name: __Host-kavach_session
      description: |
        The console session cookie (ADR-018), only when console sign-in is
        configured, and only on the operator listener. Every request with it
        must also send `X-Kavach-Console: 1` and no `Authorization` or
        `X-Kavach-Principal`; a cross-site `Origin` or `Sec-Fetch-Site` is
        refused. The server puts the session's access token in front of the
        request, so authorization is the same as with that token.

  parameters:
    ConsoleHeader:
      name: X-Kavach-Console
      in: header
      required: true
      description: The console's CSRF header; must be `1`.
      schema: { type: string, enum: ["1"] }
    Limit:
      name: limit
      in: query
      description: At most this many items (default 50; clamped to 1-200).
      schema: { type: integer, minimum: 0, maximum: 4294967295 }
    ChangeId:
      name: id
      in: path
      required: true
      schema: { type: string }
    AgentId:
      name: agent_id
      in: path
      required: true
      description: An agent id a passport names, matched exactly.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }

  headers:
    RequestId:
      description: The request's correlation id (the caller's, if plain, else a new UUID).
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1 }
    WwwAuthenticate:
      description: The bearer challenge (RFC 6750).
      schema: { type: string }

  responses:
    ConsoleRedirect:
      description: A redirect (to the identity provider, `/` or `/signin?error=<code>`), with no body.
      headers:
        Location:
          required: true
          schema: { type: string }
        Set-Cookie:
          description: The login or session cookie, or an expired one.
          schema: { type: string }
    Problem:
      description: A refusal (RFC 9457).
      headers:
        x-request-id: { $ref: "#/components/headers/RequestId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Malformed or invalid request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No valid credential.
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WwwAuthenticate" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The principal may not do this.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource, or the surface is not configured.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicts with the current state or an earlier request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: The body is larger than this endpoint takes.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: The body was not sent as application/json.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: The body is JSON but not the documented shape, or the event was rejected.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotForwardable:
      description: The gateway does not execute this tool.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Internal:
      description: An internal error; `detail` is generic, quote the `request_id`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: A dependency is unavailable.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: An RFC 9457 problem with Kavach's extensions.
      additionalProperties: false
      required: [type, title, status, detail, code, error, request_id]
      properties:
        type:
          type: string
          pattern: "^/problems/[a-z-]+$"
          description: Relative URI `/problems/<code>`; not dereferenceable yet.
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { $ref: "#/components/schemas/ProblemCode" }
        fix: { type: string, description: The usual way out for this code. }
        request_id: { type: string, description: Equals the `x-request-id` header. }
        error:
          type: string
          deprecated: true
          description: Same text as `detail`, for older clients; kept through v0.1.

    ProblemCode:
      type: string
      description: Stable machine code (`CODES` in `crates/kavach-api/src/problem.rs`).
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - rate_limited
        - unavailable
        - internal
        - not_forwardable
        - in_flight
        - no_passport
        - event_rejected
        - unprocessable
        - payload_too_large
        - unsupported_media_type
        - unknown_tool
        - invalid_envelope
        - unknown_parameter
        - missing_parameter
        - invalid_parameter
        - validation
        - model_mismatch
        - pack_not_effective

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }

    ConsoleAuthConfig:
      type: object
      additionalProperties: false
      required: [login_configured, pasted_token_allowed]
      properties:
        login_configured: { type: boolean }
        pasted_token_allowed: { type: boolean }

    ConsoleSession:
      type: object
      additionalProperties: false
      required: [principal, groups, expires_at, idle_expires_at]
      properties:
        principal: { type: string }
        groups:
          type: [array, "null"]
          items: { type: string }
          description: >-
            The groups the server's Cedar policy evaluates the principal in:
            the token's groups and the principal's memberships in the
            entities file, sorted. `null` when they are unknown or decide
            nothing (no policy loaded). For display only; the server
            authorises every request.
        expires_at:
          type: string
          format: date-time
          description: The absolute limit; a refresh never moves it.
        idle_expires_at:
          type: string
          format: date-time
          description: When the session ends without activity (never after `expires_at`).

    ConsoleLogout:
      type: object
      additionalProperties: false
      required: [end_session_url]
      properties:
        end_session_url:
          type: [string, "null"]
          description: The identity provider's end-session URL, without `id_token_hint`; null when IdP logout is off.

    Decision:
      type: string
      enum: [PASS, ALERT, BLOCK, HUMAN_REVIEW]
    GovernanceMode:
      type: string
      enum: [shadow, enforce]
    ModelOrigin:
      type: string
      enum: [in_house, vendor]
    RiskTier:
      type: string
      enum: [low, medium, high]
    ModelStatus:
      type: string
      enum: [draft, production, retired]
    RequestId:
      type: string
      pattern: "^[A-Za-z0-9._:-]{1,128}$"
    DateTime:
      type: string
      format: date-time
    NullableDateTime:
      type: [string, "null"]
      format: date-time

    EvaluateRequest:
      type: object
      required: [model_id, model_version, purpose, input, decision_time, correlation_id]
      properties:
        model_id: { type: string }
        model_version: { type: string }
        purpose: { type: string }
        consent:
          type: object
          required: [purpose_id, timestamp]
          properties:
            purpose_id: { type: string }
            timestamp: { $ref: "#/components/schemas/DateTime" }
            valid: { type: boolean, description: Ignored by the server. }
        input: { description: Validated against the model's input schema. }
        output: {}
        score: { type: number }
        confidence: { type: number }
        decision_time: { $ref: "#/components/schemas/DateTime" }
        correlation_id: { type: string }
        idempotency_key: { type: string }

    EvaluateResponse:
      type: object
      additionalProperties: false
      required: [policy_decision, returned_decision, evidence_id, reason_codes, policy_hits, latency_ms]
      properties:
        policy_decision: { $ref: "#/components/schemas/Decision" }
        returned_decision: { $ref: "#/components/schemas/Decision" }
        evidence_id: { type: [string, "null"], format: uuid }
        reason_codes: { type: array, items: { type: string } }
        policy_hits: { type: array, items: { type: string } }
        latency_ms: { type: integer, minimum: 0 }

    DevClock:
      type: object
      additionalProperties: false
      required: [kind, at, development_only]
      properties:
        kind: { type: string, enum: [fixed, started_at] }
        at: { $ref: "#/components/schemas/DateTime" }
        development_only: { const: true }

    RuntimeView:
      type: object
      additionalProperties: false
      required:
        - pack_id
        - pack_version
        - model_id
        - model_version
        - sector
        - governance_mode
        - pack_path
        - model_path
        - pack_sha256
        - pointer_version
        - model_sha256
        - model_pack_mismatch
        - stored_pointer_version
        - pointer_drift
        - insecure_dev
        - require_hardening
        - relaxations
        - agent_only
      dependentRequired:
        checkpoint_lag_seconds: [checkpoint_stalled, checkpoint_last_seq, checkpoint_uncovered_records]
      properties:
        pack_id: { type: string }
        pack_version: { type: string }
        model_id: { type: string }
        model_version: { type: string }
        sector: { type: string }
        governance_mode: { $ref: "#/components/schemas/GovernanceMode" }
        pack_path: { type: string }
        model_path: { type: string }
        pack_sha256: { type: [string, "null"] }
        pointer_version: { type: integer }
        model_sha256: { type: [string, "null"] }
        model_pack_mismatch: { type: boolean }
        stored_pointer_version: { type: integer }
        pointer_drift: { type: boolean }
        insecure_dev:
          type: boolean
          description: The process runs with `--insecure-dev` (local development only).
        require_hardening:
          type: boolean
          description: >-
            The process was started with `--require-hardening`: it refused to start unless every
            guarantee was on, and `POST /v1/dev/clock` is not mounted.
        agent_only:
          type: boolean
          description: >-
            The process runs with `--agent-only`: this listener does not serve the credit track
            (evaluate, packs, models, decision events, retention, tombstones, incidents, batch jobs),
            and change requests of those kinds are refused. The console leaves those pages out.
        relaxations:
          type: array
          description: >-
            Every way this process runs with a guarantee relaxed, by name (a fixed set,
            docs/BYPASS_INVENTORY.md section 1). Empty in production.
          items:
            type: string
            enum:
              - insecure_dev
              - access_control_none
              - principal_header
              - weaker_database_tls
              - memory_evidence_store
              - memory_agent_stores
              - test_clock
              - dev_clock
              - system_clock_declared_synced
              - unsigned_tool_registry
              - dev_keys
              - test_double_broker
        checkpoint_lag_seconds: { type: integer }
        checkpoint_stalled: { type: boolean }
        checkpoint_last_seq: { type: [integer, "null"] }
        checkpoint_uncovered_records: { type: integer }
        dev_clock: { $ref: "#/components/schemas/DevClock" }
        hsm:
          type: object
          additionalProperties: false
          required: [roles, healthy]
          properties:
            roles:
              type: array
              items: { type: string, enum: [mandate, evidence, checkpoint, credential] }
            healthy: { type: boolean }
            error: { type: string }

    PackSummary:
      type: object
      additionalProperties: false
      required: [id, version, sector, jurisdiction, effective_from, rule_count, source_path, active]
      properties:
        id: { type: string }
        version: { type: string }
        sector: { type: string }
        jurisdiction: { type: string }
        effective_from: { $ref: "#/components/schemas/DateTime" }
        rule_count: { type: integer, minimum: 0 }
        source_path: { type: string }
        active: { type: boolean }

    PolicyPack:
      type: object
      additionalProperties: false
      required: [id, version, sector, jurisdiction, effective_from, rules]
      properties:
        id: { type: string }
        version: { type: string }
        sector: { type: string }
        jurisdiction: { type: string }
        effective_from: { $ref: "#/components/schemas/DateTime" }
        description: { type: [string, "null"] }
        cel_runtime_limits:
          oneOf:
            - type: "null"
            - type: object
              properties:
                timeout_ms: { type: integer }
                max_alloc_bytes: { type: integer }
        rules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, expression, decision, reason_code]
            properties:
              id: { type: string }
              expression: { type: string }
              decision: { $ref: "#/components/schemas/Decision" }
              reason_code: { type: string }
              severity: { type: [string, "null"] }
              control_mappings: { type: array, items: { type: string } }
        control_mappings: { type: [object, "null"] }

    ModelSummary:
      type: object
      additionalProperties: false
      required:
        - model_id
        - version
        - sector
        - status
        - risk_tier
        - governance_mode
        - origin
        - pack_id
        - owner
        - source_path
        - active
        - governed
      properties:
        model_id: { type: string }
        version: { type: string }
        sector: { type: string }
        status: { $ref: "#/components/schemas/ModelStatus" }
        risk_tier: { $ref: "#/components/schemas/RiskTier" }
        governance_mode: { $ref: "#/components/schemas/GovernanceMode" }
        origin: { $ref: "#/components/schemas/ModelOrigin" }
        pack_id: { type: string }
        owner: { type: string }
        source_path: { type: string }
        active: { type: boolean }
        governed: { type: boolean }

    ModelDetail:
      type: object
      additionalProperties: false
      required:
        - model_id
        - version
        - sector
        - owner
        - risk_tier
        - origin
        - governance_mode
        - input_schema
        - human_review_hold_policy
        - status
        - pack_id
        - purpose
        - governed
      properties:
        model_id: { type: string }
        version: { type: string }
        sector: { type: string }
        owner: { type: string }
        risk_tier: { $ref: "#/components/schemas/RiskTier" }
        origin: { $ref: "#/components/schemas/ModelOrigin" }
        governance_mode: { $ref: "#/components/schemas/GovernanceMode" }
        input_schema: { description: The model's input JSON Schema. }
        human_review_hold_policy: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ModelStatus" }
        pack_id: { type: string }
        purpose: { type: string }
        governed: { type: boolean }

    ChangeKind:
      type: string
      enum:
        - activate_pack
        - rollback_pack
        - update_model
        - update_retention
        - erase_evidence
        - apply_retention
        - activate_model
        - reinstate_agent
        - grant_role
        - revoke_role
    ChangeStatus:
      type: string
      enum: [pending, applied, failed, rejected, cancelled, expired]

    AgentStateName:
      type: string
      enum: [active, restricted, quarantined, revoked]
    AgentReasonCode:
      type: string
      description: >-
        Why, from a closed set. This is what the evidence chain carries, never the
        operator's words.
      enum:
        - rogue_behaviour
        - compromise_suspected
        - policy_violation
        - customer_complaint
        - operator_request
        - reviewed
        - other
    ClosedRecordsRequest:
      type: object
      additionalProperties: false
      required: [system, records]
      properties:
        system: { type: string, minLength: 1, maxLength: 64, description: "The system of record the references belong to." }
        records:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [record_ref, state, closed_at]
            properties:
              record_ref: { type: string, minLength: 1, maxLength: 256 }
              state: { type: string, enum: [paid, disputed] }
              closed_at: { type: string, format: date-time, description: "When the lender says it was paid or disputed." }
    ClosedRecordsResult:
      type: object
      required: [checked, mismatches, information, findings, remedy]
      properties:
        checked: { type: integer, minimum: 0 }
        mismatches: { type: integer, minimum: 0 }
        information: { type: integer, minimum: 0 }
        remedy: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [kind, record_ref, state, mandate_id, holder, issued_at, expires_at]
            properties:
              kind: { type: string, enum: [should_have_been_revoked, issued_after_closure] }
              record_ref: { type: string }
              state: { type: string, enum: [paid, disputed] }
              mandate_id: { type: string }
              holder: { type: string }
              issued_at: { type: string, format: date-time }
              expires_at: { type: string, format: date-time }
    StopAgentRequest:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code: { $ref: "#/components/schemas/AgentReasonCode" }
        note:
          type: string
          maxLength: 256
          description: The operator's words. Kept in the store and the audit log, never in the chain.
    AgentStateView:
      type: object
      additionalProperties: false
      required: [agent_id, state, change_no]
      properties:
        agent_id: { type: string }
        state: { $ref: "#/components/schemas/AgentStateName" }
        change_no: { type: integer, minimum: 0, description: "0 for an agent never changed." }
        reason_code: { $ref: "#/components/schemas/AgentReasonCode" }
        note: { type: string }
        changed_by: { type: string }
        approved_by: { type: [string, "null"] }
        change_request_id: { type: [string, "null"] }
        changed_at: { type: string, format: date-time }
    AgentStatePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/AgentStateView" }
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; null when no more agents follow.
    AgentStopResult:
      type: object
      additionalProperties: false
      required: [agent_id, state, change_no, applied, record]
      properties:
        agent_id: { type: string }
        state: { $ref: "#/components/schemas/AgentStateName" }
        change_no: { type: integer, minimum: 0 }
        reason_code: { $ref: "#/components/schemas/AgentReasonCode" }
        note: { type: string }
        changed_by: { type: string }
        approved_by: { type: [string, "null"] }
        change_request_id: { type: [string, "null"] }
        changed_at: { type: string, format: date-time }
        applied: { type: boolean, description: "False when the agent was already in that state." }
        record:
          type: string
          enum: [written, pending, unchanged]
          description: >-
            Whether the change's evidence record is in the chain (`pending`: the reconciler
            writes it).
        mandates_revoked: { type: array, items: { type: string } }
        mandates_not_revoked:
          type: array
          items: { type: string }
          description: Mandates a revoke could not revoke; repeat the revoke to finish.

    ChangeProposal:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        `params` by kind: `activate_pack` `{pack_id}`; `rollback_pack` and
        `apply_retention` `{}`; `update_model` `{model_id, status?,
        governance_mode?}`; `activate_model` `{model_id, version,
        allow_downgrade?}`; `update_retention` `{evidence_retention_days}`;
        `erase_evidence` `{evidence_id}`; `reinstate_agent` `{agent_id, to: active |
        restricted, reason_code?, note?}` (never from `revoked`); `grant_role`
        `{role, subject: {kind: principal | group, issuer, value}}`; `revoke_role`
        `{binding_id}`. A role change is refused (403) when it names the caller or a group
        in their token, and when it touches `superadmin` for anyone but a superadmin; it is
        a conflict (409) for a duplicate active binding or the tenant's last active person
        binding of `superadmin` or `user_admin` (ADR-019 §4). Unknown keys are refused.
      properties:
        kind: { $ref: "#/components/schemas/ChangeKind" }
        params: { type: object }
        reason: { type: [string, "null"], maxLength: 1000 }

    ChangeRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - kind
        - params
        - binding
        - change_digest
        - reason
        - proposer
        - proposer_key
        - status
        - decided_by
        - decided_by_key
        - outcome
        - created_at
        - expires_at
        - decided_at
      properties:
        id: { type: string }
        tenant_id: { type: string }
        kind: { $ref: "#/components/schemas/ChangeKind" }
        params: {}
        binding: {}
        change_digest: { type: string }
        reason: { type: [string, "null"] }
        proposer: { type: string }
        proposer_key: { type: string }
        status: { $ref: "#/components/schemas/ChangeStatus" }
        decided_by: { type: [string, "null"] }
        decided_by_key: { type: [string, "null"] }
        outcome: {}
        created_at: { $ref: "#/components/schemas/DateTime" }
        expires_at: { $ref: "#/components/schemas/DateTime" }
        decided_at: { $ref: "#/components/schemas/NullableDateTime" }

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, action, resource_type, resource_id, actor_principal, approver_principal, payload, created_at, acting_as_superadmin]
      properties:
        id: { type: integer }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        actor_principal: { type: string }
        approver_principal: { type: string }
        payload: {}
        created_at: { $ref: "#/components/schemas/DateTime" }
        acting_as_superadmin:
          type: boolean
          description: >-
            True when the action was allowed only by a superadmin policy, or is the
            superadmin bootstrap (ADR-019). False for entries written before the flag existed.

    RetentionSettings:
      type: object
      additionalProperties: false
      required: [evidence_retention_days, updated_at, updated_by, approved_by]
      properties:
        evidence_retention_days: { type: integer, minimum: 0 }
        updated_at: { $ref: "#/components/schemas/DateTime" }
        updated_by: { type: [string, "null"] }
        approved_by: { type: [string, "null"] }

    TombstoneRecord:
      type: object
      additionalProperties: false
      required: [evidence_id, reason, actor_principal, approver_principal, tombstoned_at]
      properties:
        evidence_id: { type: string, format: uuid }
        reason: { type: string, enum: [dpdp_erasure, retention] }
        actor_principal: { type: string }
        approver_principal: { type: string }
        tombstoned_at: { $ref: "#/components/schemas/DateTime" }

    IncidentRecord:
      type: object
      additionalProperties: false
      required: [id, correlation_id, model_id, reason, recorded_at]
      properties:
        id: { type: integer }
        correlation_id: { type: string }
        model_id: { type: string }
        reason: { type: string }
        recorded_at: { $ref: "#/components/schemas/DateTime" }

    BatchJobRecord:
      type: object
      additionalProperties: false
      required:
        - job_id
        - status
        - input_path
        - output_path
        - model_id
        - governance_mode
        - total_rows
        - processed_rows
        - succeeded_rows
        - failed_rows
        - skipped_rows
        - error_summary
        - created_at
        - started_at
        - completed_at
      properties:
        job_id: { type: string }
        status: { type: string, enum: [pending, running, completed, failed] }
        input_path: { type: string, description: File name only. }
        output_path: { type: [string, "null"], description: File name only. }
        model_id: { type: string }
        governance_mode: { type: string }
        total_rows: { type: integer }
        processed_rows: { type: integer }
        succeeded_rows: { type: integer }
        failed_rows: { type: integer }
        skipped_rows: { type: integer }
        error_summary: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/DateTime" }
        started_at: { $ref: "#/components/schemas/NullableDateTime" }
        completed_at: { $ref: "#/components/schemas/NullableDateTime" }

    DecisionEvent:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - event_id
        - evidence_id
        - prev_hash
        - hash
        - pack_id
        - pack_version
        - sector
        - model_id
        - model_version
        - model_origin
        - governance_mode
        - policy_decision
        - returned_decision
        - reason_codes
        - policy_hits
        - input_digest
        - latency_ms
        - decision_time
        - evaluated_at
        - service_identity_id
        - correlation_id
      properties:
        schema_version: { type: string }
        event_id: { type: string }
        evidence_id: { type: string, format: uuid }
        prev_hash: { type: string }
        hash: { type: string }
        pack_id: { type: string }
        pack_version: { type: string }
        sector: { type: string }
        model_id: { type: string }
        model_version: { type: string }
        model_origin: { $ref: "#/components/schemas/ModelOrigin" }
        governance_mode: { $ref: "#/components/schemas/GovernanceMode" }
        policy_decision: { $ref: "#/components/schemas/Decision" }
        returned_decision: { $ref: "#/components/schemas/Decision" }
        reason_codes: { type: array, items: { type: string } }
        policy_hits: { type: array, items: { type: string } }
        pii_tokens: { type: array, items: { type: string } }
        input_digest: { type: string }
        latency_ms: { type: integer, minimum: 0 }
        decision_time: { $ref: "#/components/schemas/DateTime" }
        evaluated_at: { $ref: "#/components/schemas/DateTime" }
        service_identity_id: { type: string }
        correlation_id: { type: string }
        idempotency_key: { type: string }

    AgentDecisionRecord:
      type: object
      additionalProperties: false
      description: A signed agent decision record (evidence v2, ADR-005).
      required:
        - record_id
        - tenant_id
        - partition_id
        - seq
        - prev_hash
        - kind
        - hash_alg
        - key_id
        - actor
        - chain
        - mandate_id
        - purpose
        - consent_refs
        - action
        - request_id
        - subject_pseudonym
        - params_mac
        - policy_versions
        - signals
        - pre_commit_decision
        - policy_decision
        - returned_decision
        - obligations
        - credential_id
        - credential_expires_at
        - send_by
        - time_sync
        - ts
        - hash
        - sig
      properties:
        record_id: { type: string }
        tenant_id: { type: string }
        partition_id: { type: integer }
        seq: { type: integer }
        prev_hash: { type: string }
        kind: { type: string }
        hash_alg: { type: string }
        key_id: { type: string }
        actor:
          type: object
          additionalProperties: false
          required: [agent_id, identity_key]
          properties:
            agent_id: { type: string }
            identity_key: { type: string }
        chain: { type: array, items: { type: string } }
        mandate_id: { type: string }
        purpose: { type: string }
        consent_refs: { type: array, items: { type: string } }
        action: { type: string }
        request_id: { type: string }
        subject_pseudonym: { type: string }
        params_mac: { type: [string, "null"] }
        policy_versions:
          type: object
          additionalProperties: false
          required: [cedar, cel, packs, build]
          properties:
            cedar: { type: string }
            cel: { type: [string, "null"] }
            packs: { type: array, items: { type: string } }
            tools: { type: string }
            build: { type: string }
        signals: { type: array, items: { type: string } }
        pre_commit_decision: { $ref: "#/components/schemas/Decision" }
        policy_decision: { $ref: "#/components/schemas/Decision" }
        returned_decision: { $ref: "#/components/schemas/Decision" }
        obligations: { type: array, items: { type: string } }
        credential_id: { type: [string, "null"] }
        credential_expires_at: { $ref: "#/components/schemas/NullableDateTime" }
        send_by: { $ref: "#/components/schemas/NullableDateTime" }
        time_sync:
          type: object
          additionalProperties: false
          required: [status, max_error_ms]
          properties:
            status: { type: string, enum: [synced, unsynced, unknown, dev_fixed] }
            max_error_ms: { type: [integer, "null"] }
        ts: { $ref: "#/components/schemas/DateTime" }
        hash: { type: string }
        sig: { type: string }

    RevocationRecord:
      type: object
      additionalProperties: false
      description: A signed revocation by a system-of-record event, in the agent chain (ADR-012 §7).
      required:
        - record_id
        - tenant_id
        - partition_id
        - seq
        - prev_hash
        - kind
        - hash_alg
        - key_id
        - source_system
        - event_id
        - event_type
        - record_pseudonym
        - occurred_at
        - revoked
        - revoked_at
        - recorded_at
        - time_sync
        - hash
        - sig
      properties:
        record_id: { type: string }
        tenant_id: { type: string }
        partition_id: { type: integer }
        seq: { type: integer }
        prev_hash: { type: string }
        kind: { type: string, enum: [mandate_revocation] }
        hash_alg: { type: string }
        key_id: { type: string }
        source_system: { type: string }
        event_id: { type: string }
        event_digest: { type: string, description: "sha256-jcs-v1:<64 hex>. Exactly one of event_digest and event_sha256 is present." }
        event_sha256: { type: string, description: "Legacy: 64 hex, from records written before event_digest." }
        event_type: { type: string }
        record_pseudonym: { type: string }
        occurred_at: { $ref: "#/components/schemas/DateTime" }
        revoked: { type: array, items: { type: string } }
        revoked_at: { $ref: "#/components/schemas/DateTime" }
        recorded_at: { $ref: "#/components/schemas/DateTime" }
        time_sync:
          type: object
          additionalProperties: false
          required: [status, max_error_ms]
          properties:
            status: { type: string, enum: [synced, unsynced, unknown, dev_fixed] }
            max_error_ms: { type: [integer, "null"] }
        hash: { type: string }
        sig: { type: string }

    Outcome:
      type: string
      enum: [delivered, failed, refused, not_executed, unknown]

    OutcomeRecord:
      type: object
      additionalProperties: false
      required: [tenant_id, credential_id, record_hash, outcome, ts, key_id, sig]
      properties:
        tenant_id: { type: string }
        credential_id: { type: string }
        record_hash: { type: string }
        outcome: { $ref: "#/components/schemas/Outcome" }
        reason: { type: string }
        ts: { $ref: "#/components/schemas/DateTime" }
        key_id: { type: string }
        sig: { type: string }

    GatewayReply:
      type: object
      additionalProperties: false
      description: An allowlist of fields; never a destination or credential.
      required: [decision, reasons, request_id, outcome_recorded, replayed]
      properties:
        decision: { $ref: "#/components/schemas/Decision" }
        reasons: { type: array, items: { type: string } }
        request_id: { type: string }
        record_id: { type: string }
        outcome: { $ref: "#/components/schemas/Outcome" }
        outcome_reason: { type: string }
        provider_message_id: { type: string }
        outcome_recorded: { type: boolean }
        replayed: { type: boolean }

    SorEventResponse:
      type: object
      additionalProperties: false
      required: [mandate_id, exp, replayed]
      properties:
        mandate_id: { type: string }
        exp: { $ref: "#/components/schemas/DateTime" }
        replayed: { type: boolean }

    SorRevocationResponse:
      type: object
      additionalProperties: false
      description: What a revoking event did (ADR-012).
      required: [revoked, replayed]
      properties:
        revoked:
          type: array
          items: { type: string }
          description: Every mandate whose status changed, delegations included.
        replayed: { type: boolean }
