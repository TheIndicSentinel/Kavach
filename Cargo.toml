[workspace]
resolver = "2"
members = [
    "crates/kavach-cedar-analysis",
    "crates/kavach-clocksync",
    "crates/kavach-dataplane",
    "crates/kavach-jws",
    "crates/kavach-credential",
    "crates/kavach-mock-provider",
    "crates/kavach-authz",
    "crates/kavach-mandate",
    "crates/kavach-ports",
    "crates/kavach-ports-testkit",
    "crates/kavach-keys",
    "crates/kavach-domain",
    "crates/kavach-policy",
    "crates/kavach-evidence",
    "crates/kavach-evaluate",
    "crates/kavach-storage",
    "crates/kavach-auth",
    "crates/kavach-api",
    "crates/kavach-batch",
]
default-members = [
    "crates/kavach-authz",
    "crates/kavach-clocksync",
    "crates/kavach-dataplane",
    "crates/kavach-jws",
    "crates/kavach-credential",
    "crates/kavach-mandate",
    "crates/kavach-ports",
    "crates/kavach-ports-testkit",
    "crates/kavach-keys",
    "crates/kavach-domain",
    "crates/kavach-policy",
    "crates/kavach-evidence",
    "crates/kavach-evaluate",
    "crates/kavach-storage",
    "crates/kavach-auth",
    "crates/kavach-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Kavach"]

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
uuid = { version = "1.18.0", features = ["serde", "v4"] }
sha2 = "0.10.9"
cel-interpreter = "0.10.0"
serde_yaml = "0.9.34"
walkdir = "2.5.0"
jsonschema = "0.29.1"
kavach-domain = { path = "crates/kavach-domain", version = "0.1.0" }
kavach-policy = { path = "crates/kavach-policy", version = "0.1.0" }
kavach-evidence = { path = "crates/kavach-evidence", version = "0.1.0" }
kavach-evaluate = { path = "crates/kavach-evaluate", version = "0.1.0" }
kavach-storage = { path = "crates/kavach-storage", version = "0.1.0" }
kavach-dataplane = { path = "crates/kavach-dataplane", version = "0.1.0" }
kavach-jws = { path = "crates/kavach-jws", version = "0.1.0" }
kavach-credential = { path = "crates/kavach-credential", version = "0.1.0" }
kavach-mock-provider = { path = "crates/kavach-mock-provider", version = "0.1.0" }
kavach-clocksync = { path = "crates/kavach-clocksync", version = "0.1.0" }
kavach-auth = { path = "crates/kavach-auth", version = "0.1.0" }
kavach-batch = { path = "crates/kavach-batch", version = "0.1.0" }
kavach-ports = { path = "crates/kavach-ports", version = "0.1.0" }
kavach-ports-testkit = { path = "crates/kavach-ports-testkit", version = "0.1.0" }
kavach-keys = { path = "crates/kavach-keys", version = "0.1.0" }
ed25519-dalek = "2.2.0"
getrandom = "0.3.3"
hex = "0.4.3"
zeroize = "1.8"
ring = "0.17.14"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
proptest = "1.11.0"
kavach-mandate = { path = "crates/kavach-mandate", version = "0.1.0" }
serde_json_canonicalizer = "0.3.2"
base64 = "0.22.1"
kavach-authz = { path = "crates/kavach-authz", version = "0.1.0" }
chrono-tz = "0.10.4"
cedar-policy-symcc = "=0.7.0"
jsonwebtoken = { version = "9.3.1", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "json"] }
cedar-policy = "=4.13.0"
clap = { version = "4.5.47", features = ["derive", "env"] }
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6.11", features = ["trace", "add-extension"] }
hmac = "0.12.1"
tonic = { version = "0.12.3", features = ["transport", "tls"] }
prost = "0.14.4"
prost-types = "0.13.5"
tonic-build = "0.12.3"
axum-server = { version = "0.7.3", features = ["tls-rustls-no-provider"] }
tokio-rustls = { version = "0.26.4", default-features = false }
x509-parser = "0.18.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono", "derive", "macros", "migrate"] }
prometheus = "0.14.0"
polars = { version = "0.45.1", default-features = false, features = ["lazy", "dtype-full"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

# Keep local build output small (it reached 9 GB with full debug info, mostly
# dependencies such as polars linked into every test binary). CI already
# builds with debug info off; local builds keep file:line in backtraces for
# our own crates only, and skip incremental caches.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
