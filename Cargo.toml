[workspace]
resolver = "2"
members = [
    "crates/kavach-domain",
    "crates/kavach-policy",
    "crates/kavach-evidence",
    "crates/kavach-evaluate",
    "crates/kavach-api",
]
default-members = [
    "crates/kavach-domain",
    "crates/kavach-policy",
    "crates/kavach-evidence",
    "crates/kavach-evaluate",
    "crates/kavach-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kavach"]

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
uuid = { version = "1.18.0", features = ["serde", "v4"] }
sha2 = "0.10.9"
cel-interpreter = "0.10.0"
serde_yaml = "0.9.34"
walkdir = "2.5.0"
jsonschema = "0.29.1"
kavach-domain = { path = "crates/kavach-domain", version = "0.1.0" }
kavach-policy = { path = "crates/kavach-policy", version = "0.1.0" }
kavach-evidence = { path = "crates/kavach-evidence", version = "0.1.0" }
kavach-evaluate = { path = "crates/kavach-evaluate", version = "0.1.0" }
clap = { version = "4.5.47", features = ["derive", "env"] }
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6.11", features = ["trace"] }
hmac = "0.12.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
