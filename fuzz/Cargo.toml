[package]
name = "kavach-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Fuzz targets for Kavach's untrusted-input parsers (cargo-fuzz)"

[package.metadata]
cargo-fuzz = true

# A workspace of its own: built only with the nightly in rust-toolchain.toml,
# never by the main workspace's checks.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
kavach-api = { path = "../crates/kavach-api" }
kavach-credential = { path = "../crates/kavach-credential" }
kavach-domain = { path = "../crates/kavach-domain" }
kavach-jws = { path = "../crates/kavach-jws" }
kavach-keys = { path = "../crates/kavach-keys" }
kavach-mandate = { path = "../crates/kavach-mandate" }
kavach-ports = { path = "../crates/kavach-ports" }
kavach-ports-testkit = { path = "../crates/kavach-ports-testkit" }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = "2.2.0"
jsonwebtoken = { version = "9.3.1", default-features = false }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
tokio = { version = "1.48.0", features = ["rt"] }

[profile.release]
debug = 1

[[bin]]
name = "jws_verify"
path = "fuzz_targets/jws_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jws_signed"
path = "fuzz_targets/jws_signed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sor_event"
path = "fuzz_targets/sor_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_token"
path = "fuzz_targets/agent_token.rs"
test = false
doc = false
bench = false
