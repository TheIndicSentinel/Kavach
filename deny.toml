# Kavach dependency and license policy (cargo-deny)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "transitive via cel-interpreter; no upstream fix yet" },
]
unmaintained = "none"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "LicenseRef-Proprietary",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "kavach-domain"
expression = "LicenseRef-Proprietary"

[[licenses.clarify]]
crate = "kavach-policy"
expression = "LicenseRef-Proprietary"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
