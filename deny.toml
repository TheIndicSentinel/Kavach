# Kavach dependency and license policy (cargo-deny)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "transitive via cel-interpreter; no upstream fix yet" },
    { id = "RUSTSEC-2023-0071", reason = "transitive via unused sqlx-mysql lockfile entry; postgres-only build" },
]
unmaintained = "none"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "polars-arrow-format"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
