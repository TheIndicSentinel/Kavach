# Kavach dependency and license policy (cargo-deny)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# No ignored advisories. (RUSTSEC-2024-0436 and RUSTSEC-2023-0071 were
# ignored until the 2026-10 dependency updates removed the affected crates;
# if either returns, this check fails instead of staying silent.)
ignore = []
unmaintained = "none"

[licenses]
version = 2
# Linked-crate licence allowlist (ADR-006 §6).
# - "BSL-1.0" is the Boost Software License 1.0 (permissive) — NOT the
#   Business Source License (BUSL), which is not allowed.
# - MPL-2.0 is intentionally not allowed for linked crates. Network services
#   such as OpenBao (MPL-2.0) and Keycloak (Apache-2.0) are not linked and are
#   covered by the free-source rule and SBOM instead (PRD D6).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "polars-arrow-format"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# One rustls crypto provider (ring). With aws-lc-rs also compiled in, rustls
# cannot choose a process default and TLS servers fail at startup.
deny = [{ crate = "aws-lc-rs", reason = "rustls must use only the ring provider" }]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
