# Prometheus alert rules for kavach-api.
#
# Starting points, not tuned values: the thresholds are conservative guesses
# for a pilot and should be set from your own traffic. Every metric named
# here exists (a test, `kavach-api/tests/monitoring.rs`, fails if one is
# renamed or removed). How to scrape: README.md in this directory.
groups:
  - name: kavach-evidence
    rules:
      - alert: KavachCheckpointStalled
        expr: kavach_checkpoint_stalled == 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Agent evidence has had no checkpoint for longer than the stall threshold
          description: >-
            Records are being written but no signed checkpoint covers them, so a chain
            truncated or rewritten by someone holding the keys would go unnoticed for
            that span. Look for `ALERT evidence checkpoints stalled` in the logs and at
            `kavach_checkpoints_skipped_total{reason}`; usual causes are unsynced trusted
            time or an unavailable checkpoint key.
      - alert: KavachCheckpointLagging
        expr: time() - kavach_checkpoint_last_covered_timestamp_seconds > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The newest agent record has been uncovered by a checkpoint for over 15 minutes
          description: >-
            Also fires when the checkpoint writer has stopped: it is restarted if it
            exits, and logs a panic. Compare `kavach_checkpoint_uncovered_records`.
      - alert: KavachCheckpointsSkipped
        expr: increase(kavach_checkpoints_skipped_total[15m]) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Due checkpoints were not written (reason: {{ $labels.reason }})'
          description: >-
            The `reason` label is a fixed vocabulary. A checkpoint is never dated by a
            guess: if trusted time is unavailable it is skipped and counted.
      - alert: KavachSorEventsUnavailable
        expr: increase(kavach_sor_events_unavailable_total[10m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'System-of-record events are answered 503 (kind: {{ $labels.kind }})'
          description: >-
            Kavach could not act on the events now: the clock is not synchronised within
            the bound (check trusted time) or a store is unreachable. No new mandate is
            made while `kind="issuing"` rises; the sender retries. A `revoking` event is
            refused only when the store is down, never for the clock.
      - alert: KavachClosedLoanWithLiveAuthority
        expr: kavach_snapshot_mismatches > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: A loan the lender reports closed still has live authority
          description: >-
            The last snapshot reconciliation found live mandates for loans reported paid
            or disputed: a payment or dispute event most likely never arrived. Resend the
            signed event (it revokes through the normal path) or stop the agent. The
            reconciliation itself changed nothing. Run `POST
            /v1/reconciliation/closed-records` again after fixing; the gauge is the last
            run's count.
      - alert: KavachRevocationAuditEntryMissing
        expr: kavach_revocation_audit_entries_missing > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: A revocation has no audit entry
          description: >-
            The revocation stands (contact has stopped) but its admin audit entry could not
            be written, even by the reconciler: the audit trail has a gap. Check the admin
            store. The reconciler retries every 30 seconds, so this clears when the store
            recovers. `ALERT revocation audit entry missing` in the logs names the events.
      - alert: KavachRevocationAuditReconcilerStopped
        expr: time() - kavach_revocation_audit_last_pass_timestamp_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The revocation audit reconciler has not completed a pass for 5 minutes
          description: >-
            It runs every 30 seconds and is restarted if it exits. A pass that cannot read
            the revocations does not count as complete.
      - alert: KavachSnapshotNotRunRecently
        expr: >-
          kavach_snapshot_last_run_timestamp_seconds > 0
          and time() - kavach_snapshot_last_run_timestamp_seconds > 604800
        labels: { severity: warning }
        annotations:
          summary: Snapshot reconciliation has not been run for a week
          description: >-
            It only runs when the lender's list of closed loans is sent (`kavach reconcile`),
            so a lost payment event is found only that often. The gauge
            `kavach_snapshot_mismatches` is the last run's result and keeps its value until
            the next run. This does not fire until the first run; adjust the week to the
            lender's cadence.
      - alert: KavachRevocationRecordMissing
        expr: kavach_revocation_records_missing > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: A revocation has no evidence record
          description: >-
            Contact for the loan has stopped (the revocation stands), but its signed
            record is not in the evidence chain and the reconciler cannot write it. See
            `ALERT revocation evidence missing` in the logs for the event ids and why.
      - alert: KavachRevocationReconcilerStopped
        expr: time() - kavach_revocation_reconcile_last_pass_timestamp_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The revocation evidence reconciler has not completed a pass for 5 minutes
          description: >-
            It runs every 30 seconds and is restarted if it exits. A pass that cannot read
            the revocations or the evidence store does not count as complete.

      - alert: KavachAgentStateRecordMissing
        expr: kavach_agent_state_records_missing > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: A change of an agent's state has no evidence record
          description: >-
            The agent is stopped (or reinstated) as the store says, but the signed record
            of that change is not in the evidence chain and the reconciler cannot write
            it. See `ALERT agent state evidence missing` in the logs for the agent, the
            change number and why.
      - alert: KavachAgentStateReconcilerStopped
        expr: time() - kavach_agent_state_reconcile_last_pass_timestamp_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The agent state evidence reconciler has not completed a pass for 5 minutes
          description: >-
            It runs every 30 seconds and is restarted if it exits. A pass that cannot read
            the state history or the evidence store does not count as complete.

      - alert: KavachOutcomeConflicted
        expr: kavach_outcomes_conflicted > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: A send has two different confirmed answers
          description: >-
            A send whose result was unknown has been confirmed as delivered by one source
            and as not delivered by another, and no two people have closed it. Neither is
            reported as true. Treat it as an incident: find the two resolutions (the
            evidence export lists them with their sources) and have two different people
            close it with a reference.
      - alert: KavachOutcomeAmbiguous
        expr: kavach_outcomes_ambiguous > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: A send's result is still unknown after 24 hours and nobody could say
          description: >-
            The provider gave no confirmed answer within the hour it is asked, and the
            reconciler has said ambiguous. The call stays on the list until a person
            attests what happened. It has not been resent and will not be.
      - alert: KavachOutcomeUnconfirmedOld
        expr: kavach_outcome_oldest_unconfirmed_age_seconds > 259200
        labels: { severity: warning }
        annotations:
          summary: A send's result has been unconfirmed for more than 3 days
          description: >-
            The oldest unknown outcome that is not resolved is older than three days. The
            reconciler stops asking after an hour and says ambiguous after 24 hours, so an
            older one is waiting for a person. The three days is a default; set it to how
            long the lender can tolerate not knowing whether a borrower was contacted.
      - alert: KavachOutcomeReconcilerStopped
        expr: >-
          kavach_outcome_reconcile_last_pass_timestamp_seconds > 0
          and time() - kavach_outcome_reconcile_last_pass_timestamp_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The unknown-outcome reconciler has not completed a pass for 5 minutes
          description: >-
            It runs every 15 seconds and is restarted if it exits. A pass that cannot read
            the outcomes or the evidence store does not count as complete. It keys on the
            time of the last pass, not on the counts (a dead reconciler would leave stale
            counts that look healthy), and stays silent until the first pass, so it does
            not fire on a fresh install or when the agent surfaces are off.

      - alert: KavachAgentStopped
        expr: sum(increase(kavach_agent_state_changes_total{result="applied",to=~"quarantined|revoked"}[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: An agent was quarantined or revoked
          description: >-
            An operator stopped an agent through the API. That is an incident response, or
            a mistake, or a misused credential: the audit log names who and why (the
            `stop_agent` entries), and the evidence chain holds the signed change.
      - alert: KavachAgentStopBurst
        expr: sum(increase(kavach_agent_state_changes_total{result=~"applied|rate_limited"}[10m])) > 5
        labels: { severity: critical }
        annotations:
          summary: Many agent stops in ten minutes
          description: >-
            More than five stops in ten minutes, or stops refused by the global limit. A
            real incident can look like this; so can a stolen operator credential stopping
            every agent. There is no bulk stop, and the limit bounds the damage. Check the
            audit log for `stop_agent` and `stop_agent_refused`.
      - alert: KavachAgentStopForbidden
        expr: sum(increase(kavach_agent_state_changes_total{result="forbidden"}[10m])) > 0
        labels: { severity: warning }
        annotations:
          summary: A principal that may not stop agents tried to
          description: >-
            Someone without `stop_agent` called a stop route. The attempt is in the audit log
            as `stop_agent_refused`.

  - name: kavach-gateway
    rules:
      - alert: KavachOutcomeWriteFailures
        expr: increase(kavach_gateway_outcome_write_failures_total[10m]) > 0
        labels: { severity: critical }
        annotations:
          summary: A call's outcome could not be recorded
          description: >-
            The provider was contacted but the outcome did not reach the evidence store;
            the allow will be reported as missing an outcome. Check the evidence store.
      - alert: KavachCredentialIdConflict
        expr: increase(kavach_gateway_jti_conflicts_total[10m]) > 0
        labels: { severity: critical }
        annotations:
          summary: A credential id was minted twice
          description: >-
            A credential is issued at most once per record. A conflict should not happen:
            treat it as a possible integrity problem and investigate before anything else.
      - alert: KavachUnknownOutcomesHigh
        expr: >-
          sum(rate(kavach_gateway_calls_total{outcome="unknown"}[15m]))
          / clamp_min(sum(rate(kavach_gateway_calls_total{decision=~"PASS|ALERT"}[15m])), 0.001)
          > 0.05
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: More than 5% of allowed calls ended with an unknown outcome
          description: >-
            Sent, result not known (a timeout or a 5xx from the provider). An unknown
            outcome is never retried; it is settled by reconciliation with the provider.
      - alert: KavachCommitSlow
        expr: >-
          histogram_quantile(0.99,
            sum by (le) (rate(kavach_gateway_stage_seconds_bucket{stage="commit"}[5m]))) > 0.25
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Recording decisions takes over 250 ms at p99
          description: >-
            Decisions of one tenant are recorded in order under one lock; this is the
            stage that grows when the evidence store is slow or a tenant's rate rises.
      - alert: KavachGatewayMalformedSpike
        expr: increase(kavach_gateway_malformed_total[10m]) > 100
        labels: { severity: warning }
        annotations:
          summary: Many malformed gateway calls
          description: >-
            Malformed calls are refused (400) and not recorded. A spike can be a broken
            agent or probing.

  - name: kavach-service
    rules:
      - alert: KavachDown
        expr: up{job="kavach-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: kavach-api cannot be scraped
          description: >-
            Set `job` to your scrape job's name. The metrics endpoint is on the operator
            listener and needs an operator token (README.md).
      - alert: KavachIncidentWriteFailures
        expr: increase(kavach_incident_write_failures_total[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: A shadow-mode incident could not be recorded
          description: >-
            Shadow sync must not disrupt the lender's flow, so the caller still got PASS;
            this counter and an `ALERT` log line are the only signal.
      - alert: KavachModelPackMismatch
        expr: kavach_model_pack_mismatch == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: A governed model runs under a different pack than the one it was written for
          description: Reported, not blocked (ADR-010 section 4). Review before the next change.
      - alert: KavachEvaluateErrors
        expr: >-
          sum(rate(kavach_evaluate_requests_total{status_class="5xx"}[5m]))
          / clamp_min(sum(rate(kavach_evaluate_requests_total[5m])), 0.001) > 0.01
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: More than 1% of evaluate requests fail with a server error
          description: Decision Governance track (the frozen credit path).
