# TLS only. Every TCP connection must use TLS; plaintext is refused by the
# server itself, whatever the client asks for. The local socket (inside the
# container: initialisation scripts and health checks) is not reachable
# from the network.
# TYPE     DATABASE  USER  ADDRESS     METHOD
local      all       all               trust
hostssl    all       all   0.0.0.0/0   scram-sha-256
hostssl    all       all   ::/0        scram-sha-256
hostnossl  all       all   0.0.0.0/0   reject
hostnossl  all       all   ::/0        reject
