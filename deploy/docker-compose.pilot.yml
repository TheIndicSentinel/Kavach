# Partner pilot stack — Postgres + kavach-api with embedded console.
# Usage:
#   cp deploy/pilot.env.example deploy/.env
#   docker compose -f deploy/docker-compose.pilot.yml up --build
#
# Batch shadow smoke (one-shot):
#   docker compose -f deploy/docker-compose.pilot.yml run --rm batch-shadow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kavach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-kavach}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kavach-pilot-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kavach} -d ${POSTGRES_DB:-kavach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kavach-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KAVACH_DATABASE_URL: postgres://${POSTGRES_USER:-kavach}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-kavach}
    ports:
      - "${KAVACH_HTTP_PORT:-8080}:8080"
      - "${KAVACH_GRPC_PORT:-50051}:50051"

  batch-shadow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["batch"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["kavach-batch"]
    command:
      - run
      - --input
      - partner/finance/credit_underwriting_v1_batch.ndjson
      - --output
      - /tmp/kavach-pilot-out.ndjson
      - --pack
      - packs/finance/v0.yaml
      - --model
      - models/finance/credit-underwriting-v1.yaml
      - --evidence-store
      - postgres
    environment:
      KAVACH_DATABASE_URL: postgres://${POSTGRES_USER:-kavach}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-kavach}
    volumes:
      - pilot-batch-out:/tmp

volumes:
  kavach-pilot-pg:
  pilot-batch-out:
