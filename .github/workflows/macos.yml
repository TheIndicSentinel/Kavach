name: CLI on macOS

# The developer preview runs on developers' Macs, so the CLI and its suites
# are built and run there too. macOS minutes are billed at about ten times
# Linux minutes (a 15-minute run is about 150 of the allowance), which a
# private repository's free allowance cannot carry on a schedule: this runs
# **on demand only**, and before a release. It is not a required check.
on:
  workflow_dispatch:

# A newer push to the same PR makes the older run pointless: cancel it.
# Pushes to main and tags queue instead, so no run there is cut short.
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  cli-macos:
    name: CLI on macOS
    timeout-minutes: 25
    # The developer preview runs on developers' Macs: build the CLI there and
    # run its suites, including dev up, kavach attack and kavach demo end to
    # end (the stack runs in-process with --insecure-dev; macOS has no
    # kernel clock status to prove synced time).
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # No Postgres service on macOS runners: the one Postgres-backed CLI test
      # is skipped by name here (the Linux job runs it; the test helper fails
      # rather than skips under CI, so this has to be explicit).
      - name: cargo test (kavach-cli)
        run: cargo test -p kavach-cli --locked -- --skip evidence_export_from_postgres
