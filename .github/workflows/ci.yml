name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Format, Clippy, Test
    runs-on: ubuntu-latest
    services:
      # Postgres integration tests (kavach-storage, kavach-api). Each test uses
      # its own schema; tests fail rather than skip when CI lacks the database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kavach
          POSTGRES_PASSWORD: kavach-ci
          POSTGRES_DB: kavach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kavach -d kavach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Keep target/ small enough for the hosted runner disk (polars is large).
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-10-01)
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build console
        run: ./scripts/build-console.sh

      # Production npm dependency licence allowlist (PRD NFR-1). OFL-1.1 covers the
      # @fontsource fonts; MPL-2.0 covers build-time CSS tooling (lightningcss) that is
      # not included in the built console bundle.
      - name: Console licence check
        working-directory: console
        run: >
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages
          --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;OFL-1.1;MPL-2.0;BlueOak-1.0.0;CC0-1.0"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # SoftHSM2 for the PKCS#11 key provider's tests (crates/kavach-keys-pkcs11).
      # Its EdDSA support is proven by scripts/softhsm-eddsa-probe.sh.
      - name: Install SoftHSM2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2
          dpkg -s softhsm2 | grep -E "^Version"

      # Before the tests start: they must not change their own environment.
      - name: Prepare a SoftHSM token
        run: scripts/softhsm-test-token.sh "$RUNNER_TEMP/softhsm" >>"$GITHUB_ENV"

      - name: cargo test
        env:
          KAVACH_TEST_DATABASE_URL: postgres://kavach:kavach-ci@localhost:5432/kavach_test
          KAVACH_TEST_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: cargo test --workspace --verbose

      # A trend for the KMS decision on which keys go to an HSM: sign latency
      # against SoftHSM and in-process Ed25519 on this runner. Not a figure
      # to quote; asserts nothing about the numbers.
      - name: HSM sign latency (trend)
        env:
          KAVACH_TEST_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: cargo test -p kavach-keys-pkcs11 --test softhsm -- --ignored --nocapture sign_latency

      - name: Partner pilot batch smoke
        run: SKIP_VERIFY=1 ./scripts/pilot-smoke.sh

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: cargo audit
        run: cargo audit

  deny:
    name: License and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: cargo deny
        run: cargo deny check

  jose-crosscheck:
    name: Credential interop (independent jose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Decrypt and verify the checked-in credential vector with jose
        working-directory: scripts/jose-crosscheck
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node check.mjs ../../crates/kavach-credential/tests/vectors/credential-v1.json

      - name: Canonicalise the JCS vectors with canonicalize (RFC 8785)
        working-directory: scripts/jose-crosscheck
        run: node jcs.mjs ../../crates/kavach-ports/tests/vectors/jcs-v1.json

  cedar-analysis:
    name: Agent policy analysis (Cedar + cvc5)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Pinned cvc5 1.3.1 non-GPL static build (BSD-3-Clause), SHA-256 verified.
      - name: Install cvc5
        run: |
          ./scripts/fetch-cvc5.sh
          echo "CVC5=$PWD/.tools/cvc5/bin/cvc5" >> "$GITHUB_ENV"

      # Proves the PRD properties for crates/kavach-authz/policies and checks
      # that deliberately weakened policies are detected.
      - name: Prove agent policy properties
        run: cargo run --locked -p kavach-cedar-analysis

  clock-sync-probe:
    name: Trusted-time probe (host and container)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build probe
        run: cargo build --locked --release -p kavach-clocksync --bin kavach-clocksync

      # Classify only: runners may or may not report kernel sync, so the job
      # checks that each environment yields a classification, and records
      # which one (ADR-003 §7). The container runs use the same glibc as the
      # runner (ubuntu:24.04) so the host-built binary loads.
      - name: Probe on host, in a container (default seccomp) and unconfined
        run: |
          probe=target/release/kavach-clocksync
          check() {
            echo "$1: $2"
            echo "$2" | python3 -c 'import json,sys; s=json.load(sys.stdin)["sync"]["status"]; assert s in ("synced","unsynced","unknown"), s'
          }
          check "host" "$($probe)"
          check "container-default-seccomp" "$(docker run --rm -v "$PWD/$probe:/probe:ro" ubuntu:24.04 /probe)"
          check "container-seccomp-unconfined" "$(docker run --rm --security-opt seccomp=unconfined -v "$PWD/$probe:/probe:ro" ubuntu:24.04 /probe)"
