name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A newer push to the same PR makes the older run pointless: cancel it
# Pushes to main queue instead, so no run there is cut short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # Documentation-only pull requests do not need the build and the suites.
  # Decided in a job (not a `paths-ignore`) so every other job still reports
  # (skipped counts as passing) and a required check cannot hang.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Does this change touch more than documentation?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # If anything below fails, the answer is "run everything", never
          # "skip everything": a skipped job counts as passing.
          emitted=0
          emit() { echo "code=$1" >> "$GITHUB_OUTPUT"; emitted=1; }
          trap '[ "$emitted" = 1 ] || echo "code=true" >> "$GITHUB_OUTPUT"' EXIT
          if [ "$EVENT" != "pull_request" ]; then
            emit true; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          # A document the Rust sources name (an `include_str!`, a
          # `read_to_string`, a path helper) is read by a test: a change to
          # it is a code change, and the set is computed, not listed, so a
          # new reference is covered without editing this job. Over-inclusive
          # on purpose (a path in a comment counts): the safe direction.
          referenced=$(grep -rhoE 'docs/[A-Za-z0-9_./-]+\.(md|yaml|yml|json)' crates --include='*.rs' | sort -u || true)
          printf 'documents the sources read:\n%s\n' "$referenced"
          # Everything outside documentation is code.
          other=$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$|^LICENSE$|^NOTICE$' || true)
          # ...and so is a documentation file a test reads.
          read_by_tests=$(printf '%s\n' "$files" | grep -Fx -f <(printf '%s\n' "$referenced") || true)
          if [ -n "$other$read_by_tests" ]; then
            emit true
          else
            emit false
          fi
          printf 'changed files:\n%s\n' "$files"

  check:
    name: Format, Clippy, Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    services:
      # Postgres integration tests (kavach-storage, kavach-api). Each test uses
      # its own schema; tests fail rather than skip when CI lacks the database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kavach
          POSTGRES_PASSWORD: kavach-ci
          POSTGRES_DB: kavach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kavach -d kavach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Keep target/ small enough for the hosted runner disk (polars is large).
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every operation in docs/openapi.yaml is called from console/src, or
      # listed with a reason in console/api-coverage-exempt.txt; a stale
      # exemption fails too. Python standard library only, so it runs first.
      - name: Console API path coverage
        run: |
          python3 -I -m unittest discover -s scripts -p 'test_console_path_coverage.py' -v
          python3 -I scripts/console_path_coverage.py --list

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-10-01)
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build console
        run: ./scripts/build-console.sh

      # Typecheck, lint (TypeScript, React hooks, jsx-a11y), unit tests, and
      # the generated API types must match docs/openapi.yaml.
      - name: Console checks
        working-directory: console
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run check:api

      # Browser checks (console/e2e): axe (WCAG 2.2 AA tags) on every page and
      # action state, keyboard-only flows, and kavach-api's own CSP enforced on
      # the built console. Every API call is stubbed; nothing leaves the runner
      # but the Chromium download. Specs read crates/ files, so this needs the
      # full checkout.
      - name: Install Playwright Chromium
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: Console browser checks
        working-directory: console
        run: npm run test:e2e

      # The real sign-in round trip (ADR-018): kavach-api with console/dist
      # embedded (built above) and the OIDC test double, both on 127.0.0.1,
      # memory stores, no database. Nothing is stubbed; no network beyond
      # loopback. Specs: console/e2e/*.roundtrip.ts.
      - name: Build kavach-api and the OIDC test double
        run: cargo build -p kavach-api --bin kavach-api --example oidc_double

      - name: Console sign-in round trip
        working-directory: console
        run: npm run test:roundtrip

      # The console against a real, seeded stack (playwright.real.config.ts):
      # a dev bundle, the OIDC double, the mock provider, and kavach-api in
      # full and --agent-only modes; every page and action, signed in as an
      # admin, a change approver and a viewer. Loopback only, memory stores.
      - name: Build the real-stack binaries
        run: cargo build -p kavach-devkit --bin kavach-dev -p kavach-mock-provider --bin kavach-mock-provider

      - name: Console on a real stack
        working-directory: console
        run: npm run test:real

      # scripts/demo.sh from a fresh clone of this commit, as a person runs it:
      # it builds the console and the binaries (cargo reuses this job's
      # dependencies through CARGO_TARGET_DIR), starts the stack against the
      # Postgres service in a schema of its own, and seeds it. Then every demo
      # user signs in through the test IdP's "Sign in as" page and opens every
      # page (console/e2e/signin.demo.ts), and `demo.sh stop` drops the schema.
      - name: demo.sh from a fresh clone, signed in as each user
        env:
          KAVACH_DEMO_DATABASE_URL: postgres://kavach:kavach-ci@localhost:5432/kavach_test
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          command -v psql pg_isready
          clone="$RUNNER_TEMP/kavach-demo-clone"
          git clone -q --no-local "$GITHUB_WORKSPACE" "$clone"
          git -C "$clone" checkout -q --detach "$(git rev-parse HEAD)"
          trap '"$clone/scripts/demo.sh" stop' EXIT
          "$clone/scripts/demo.sh"
          (cd console && npm run test:demo)

      # Production npm dependency licence allowlist (PRD NFR-1). OFL-1.1 covers the
      # @fontsource fonts; MPL-2.0 covers build-time CSS tooling (lightningcss) that is
      # not included in the built console bundle.
      - name: Console licence check
        working-directory: console
        run: >
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages
          --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;OFL-1.1;MPL-2.0;BlueOak-1.0.0;CC0-1.0"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # SoftHSM2 for the PKCS#11 key provider's tests (crates/kavach-keys-pkcs11).
      # Its EdDSA support is proven by scripts/softhsm-eddsa-probe.sh.
      - name: Install SoftHSM2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2
          dpkg -s softhsm2 | grep -E "^Version"

      # Before the tests start: they must not change their own environment.
      - name: Prepare a SoftHSM token
        run: scripts/softhsm-test-token.sh "$RUNNER_TEMP/softhsm" >>"$GITHUB_ENV"

      - name: cargo test
        env:
          KAVACH_TEST_DATABASE_URL: postgres://kavach:kavach-ci@localhost:5432/kavach_test
          KAVACH_TEST_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: cargo test --workspace --verbose

      # The HSM goes away mid-run and comes back (calls BLOCK, /v1/runtime
      # unhealthy, recovery without a restart). It rewrites its token's
      # configuration, so it gets a token of its own.
      - name: HSM outage and recovery (its own token)
        env:
          KAVACH_TEST_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
          KAVACH_TEST_HSM_OUTAGE: "1"
        run: |
          export "$(scripts/softhsm-test-token.sh "$RUNNER_TEMP/softhsm-outage")"
          cargo test -p kavach-api --test hsm_outage -- --nocapture

      # A trend for the KMS decision on which keys go to an HSM: sign latency
      # against SoftHSM and in-process Ed25519 on this runner. Not a figure
      # to quote; asserts nothing about the numbers.
      - name: HSM sign latency (trend)
        env:
          KAVACH_TEST_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: cargo test -p kavach-keys-pkcs11 --test softhsm -- --ignored --nocapture sign_latency

      - name: Partner pilot batch smoke
        run: SKIP_VERIFY=1 ./scripts/pilot-smoke.sh

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: cargo audit
        run: cargo audit

  deny:
    name: License and dependency policy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: cargo deny
        run: cargo deny check

  openapi-lint:
    name: OpenAPI lint (Redocly, pinned)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Structure and style only; what the server returns is held to the
      # spec by the contract tests in the Rust job.
      - name: Lint docs/openapi.yaml
        run: npx --yes @redocly/cli@1.25.0 lint --format=github-actions docs/openapi.yaml

  jose-crosscheck:
    name: Credential interop (independent jose)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Decrypt and verify the checked-in credential vector with jose
        working-directory: scripts/jose-crosscheck
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node check.mjs ../../crates/kavach-credential/tests/vectors/credential-v1.json

      - name: Canonicalise the JCS vectors with canonicalize (RFC 8785)
        working-directory: scripts/jose-crosscheck
        run: node jcs.mjs ../../crates/kavach-ports/tests/vectors/jcs-v1.json

  conformance:
    name: Independent verifier (Python, standard library only)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the published vectors and refuse every mutation
        run: python3 -I -m unittest discover -s conformance -v

  cedar-analysis:
    name: Agent policy analysis (Cedar + cvc5)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Pinned cvc5 1.3.1 non-GPL static build (BSD-3-Clause), SHA-256 verified.
      - name: Install cvc5
        run: |
          ./scripts/fetch-cvc5.sh
          echo "CVC5=$PWD/.tools/cvc5/bin/cvc5" >> "$GITHUB_ENV"

      # Proves the PRD properties for crates/kavach-authz/policies and checks
      # that deliberately weakened policies are detected.
      - name: Prove agent policy properties
        run: cargo run --locked -p kavach-cedar-analysis

  clock-sync-probe:
    name: Trusted-time probe (host and container)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build probe
        run: cargo build --locked --release -p kavach-clocksync --bin kavach-clocksync

      # Classify only: runners may or may not report kernel sync, so the job
      # checks that each environment yields a classification, and records
      # which one (ADR-003 §7). The container runs use the same glibc as the
      # runner (ubuntu:24.04) so the host-built binary loads.
      - name: Probe on host, in a container (default seccomp) and unconfined
        run: |
          probe=target/release/kavach-clocksync
          check() {
            echo "$1: $2"
            echo "$2" | python3 -c 'import json,sys; s=json.load(sys.stdin)["sync"]["status"]; assert s in ("synced","unsynced","unknown"), s'
          }
          check "host" "$($probe)"
          check "container-default-seccomp" "$(docker run --rm -v "$PWD/$probe:/probe:ro" ubuntu:24.04 /probe)"
          check "container-seccomp-unconfined" "$(docker run --rm --security-opt seccomp=unconfined -v "$PWD/$probe:/probe:ro" ubuntu:24.04 /probe)"
