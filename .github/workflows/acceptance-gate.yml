name: Acceptance gate

# PRD: all acceptance scenarios pass "20 consecutive runs without flakiness".
# Runs the acceptance suite (including the attack catalog, in process, on
# memory and Postgres), the gateway end-to-end tests and `kavach attack`
# against a real dev stack (the same catalog over HTTP) and `kavach demo` 20 times, nightly
# and on demand (run it before tagging a release). Not a required PR check
# (too slow per PR); a failure here is a flake to fix.
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
    inputs:
      runs:
        description: Consecutive runs required
        default: "20"

permissions:
  contents: read

jobs:
  repeat:
    name: Acceptance suite and kavach attack, 20 consecutive runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kavach
          POSTGRES_PASSWORD: kavach-ci
          POSTGRES_DB: kavach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kavach -d kavach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      KAVACH_TEST_DATABASE_URL: postgres://kavach:kavach-ci@localhost:5432/kavach_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-10-01)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the suites once
        run: |
          cargo test -p kavach-api --test acceptance --test gateway --no-run
          cargo test -p kavach-cli --test cli --no-run

      - name: Run them back to back; any failure fails the gate
        env:
          RUNS: ${{ github.event.inputs.runs || '20' }}
        run: |
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i of $RUNS"
            cargo test -q -p kavach-api --test acceptance --test gateway || {
              echo "::error::flaky or failing on run $i of $RUNS"; exit 1; }
            cargo test -q -p kavach-cli --test cli attack_catalog_is_refused_against_a_dev_stack || {
              echo "::error::kavach attack flaky or failing on run $i of $RUNS"; exit 1; }
            cargo test -q -p kavach-cli --test cli demo_runs_every_step_as_scripted || {
              echo "::error::kavach demo flaky or failing on run $i of $RUNS"; exit 1; }
            echo "::endgroup::"
          done
          echo "$RUNS consecutive clean runs"
