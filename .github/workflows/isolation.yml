name: Network isolation

# H5b-2: on a real compose deployment, an agent container can reach only
# the gateway's agent listener — not Kavach's other listeners (checked on
# the agent-network IP too, to catch a wrong bind), not Postgres, not the
# provider, not the internet — holds no key material, and acts only
# through the gateway (TLS to the provider). The test agent's exit status
# is the result.
#
# Then the evidence: the read-only auditor role exports what the probe
# left behind and `kavach-evidence verify-bundle` checks it offline,
# against a checkpoint the running API wrote (ADR-005 §13).
#
# Delivery depends on the 08:00–19:00 IST contact window: outside it the
# probe expects a window BLOCK. The scheduled run at 12:00 IST sets
# REQUIRE_DELIVERY, so anything but a delivery fails loudly.
#
# A required check on main (promoted after 11 consecutive green runs).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *" # 12:00 IST
  workflow_dispatch:
    inputs:
      require_delivery:
        description: Fail unless a reminder is delivered
        default: "false"

permissions:
  contents: read

jobs:
  isolation:
    name: Network isolation (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REQUIRE_DELIVERY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.require_delivery || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the Kavach image (production Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          tags: kavach:local
          load: true
          cache-from: type=gha,scope=kavach
          cache-to: type=gha,mode=max,scope=kavach

      - name: Build the test image (dev tools + mock provider)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/agent-stack/Dockerfile.e2e
          tags: kavach-e2e:local
          load: true
          cache-from: type=gha,scope=kavach-e2e
          cache-to: type=gha,mode=max,scope=kavach-e2e

      - name: Bring up the stack and run the isolation probe
        working-directory: deploy/agent-stack
        run: |
          mkdir -m 777 bundle
          docker compose run --rm setup
          docker compose up -d --no-build --wait --wait-timeout 180 postgres kavach mock-provider
          docker compose run --rm issue-mandate
          docker compose run --rm test-agent

      # The deployed-stack test of evidence checkpoints: the running API
      # (production image, Postgres) must have checkpointed the probe's
      # records; the auditor role exports them and the bundle verifies
      # offline against a checkpoint taken first, with nothing unprotected.
      - name: Export the evidence as the auditor and verify it offline
        working-directory: deploy/agent-stack
        run: docker compose run --rm export-evidence

      - name: Stack logs
        if: always()
        working-directory: deploy/agent-stack
        run: docker compose logs --no-color --timestamps || true

      - name: Tear down
        if: always()
        working-directory: deploy/agent-stack
        run: docker compose down -v || true
