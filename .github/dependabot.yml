# Dependency updates arrive as PRs and must pass the same required checks
# (tests, cargo-deny licence/advisory policy, policy proofs) as any change.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      console-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /scripts/jose-crosscheck
    schedule:
      interval: monthly
