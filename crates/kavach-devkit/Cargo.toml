[package]
name = "kavach-devkit"
description = "DEVELOPMENT ONLY: generates a complete Kavach dev bundle (dev- keys, signed tool registry, dev CA, fixtures, tokens) for local stacks, the compose isolation tests and, later, `kavach init`"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "kavach-dev"
path = "src/bin/kavach-dev.rs"

[dependencies]
kavach-credential = { workspace = true }
kavach-domain = { workspace = true }
kavach-keys = { workspace = true }
kavach-mandate = { workspace = true }
kavach-ports = { workspace = true }
base64 = { workspace = true }
chrono.workspace = true
clap.workspace = true
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
kavach-jws = { workspace = true }

[lints]
workspace = true
