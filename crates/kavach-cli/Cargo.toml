[package]
name = "kavach-cli"
description = "kavach: the developer command line (init, doctor, dev up)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kavach"
path = "src/main.rs"

[dependencies]
kavach-api = { workspace = true }
kavach-attacks = { workspace = true }
kavach-auth = { workspace = true }
kavach-clocksync = { workspace = true }
kavach-credential = { workspace = true }
kavach-dataplane = { workspace = true }
kavach-devkit = { workspace = true }
kavach-sim = { workspace = true }
kavach-domain = { workspace = true }
kavach-evaluate = { workspace = true }
kavach-evidence = { workspace = true }
kavach-evidence-cli = { workspace = true }
kavach-jws = { workspace = true }
kavach-keys = { workspace = true }
kavach-mock-provider = { workspace = true }
kavach-policy = { workspace = true }
kavach-ports = { workspace = true }
kavach-storage = { workspace = true }
kavach-telemetry = { workspace = true }
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
hex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["signal", "time"] }
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
kavach-storage = { workspace = true, features = ["test-support"] }

