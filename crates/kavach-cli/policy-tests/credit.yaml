# Policy tests for the credit-underwriting model (kavach policy test).
#
# Format version 1 (pre-alpha). Each case is a decision request evaluated
# against this project's policy pack (CEL, .kavach/policy/finance-v0.yaml)
# and model (.kavach/policy/credit-underwriting-v1.yaml), the shape
# `POST /v1/evaluate` takes. Server time defaults to the request's
# decision_time. `decision` is the returned decision under governance_mode
# (enforce by default; shadow returns PASS for anything else).
#
# Converted from golden/finance/v0. Synthetic data only.
version: 1
cases:
  - {"kind": "evaluate", "name": "Compliant credit application \u2014 all v0 pack checks pass", "request": {"model_id": "credit-underwriting-v1", "model_version": "1.0.0", "purpose": "credit_decision", "consent": {"purpose_id": "credit_decision", "timestamp": "2026-08-01T10:00:00Z"}, "input": {"credit_score": 740, "income": 85000, "debt_ratio": 0.32, "loan_amount": 300000, "employment_years": 6}, "confidence": 0.89, "decision_time": "2026-08-01T10:00:01Z", "correlation_id": "golden-v0-credit-clean-001"}, "expect": {"decision": "PASS", "reasons_include": ["CONSENT_OK"]}}

  - {"kind": "evaluate", "name": "Debt ratio 47% exceeds 40% RBI-style cap \u2014 ALERT", "request": {"model_id": "credit-underwriting-v1", "model_version": "1.0.0", "purpose": "credit_decision", "consent": {"purpose_id": "credit_decision", "timestamp": "2026-08-01T10:00:00Z"}, "input": {"credit_score": 680, "income": 52000, "debt_ratio": 0.47, "loan_amount": 450000, "employment_years": 2}, "confidence": 0.78, "decision_time": "2026-08-01T10:00:01Z", "correlation_id": "golden-v0-credit-dti-001"}, "expect": {"decision": "ALERT", "reasons_include": ["RBI_DTI_EXCEEDED"]}}

  - {"kind": "evaluate", "name": "Debt ratio 47% exceeds 40% RBI-style cap \u2014 ALERT (shadow mode returns PASS)", "governance_mode": "shadow", "request": {"model_id": "credit-underwriting-v1", "model_version": "1.0.0", "purpose": "credit_decision", "consent": {"purpose_id": "credit_decision", "timestamp": "2026-08-01T10:00:00Z"}, "input": {"credit_score": 680, "income": 52000, "debt_ratio": 0.47, "loan_amount": 450000, "employment_years": 2}, "confidence": 0.78, "decision_time": "2026-08-01T10:00:01Z", "correlation_id": "golden-v0-credit-dti-001"}, "expect": {"decision": "PASS"}}

  - {"kind": "evaluate", "name": "Informal sector applicant \u2014 HUMAN_REVIEW", "request": {"model_id": "credit-underwriting-v1", "model_version": "1.0.0", "purpose": "credit_decision", "consent": {"purpose_id": "credit_decision", "timestamp": "2026-08-01T10:00:00Z"}, "input": {"credit_score": 0, "income": 28000, "debt_ratio": 0.28, "loan_amount": 80000, "employment_years": 0, "informal_sector": true}, "confidence": 0.49, "decision_time": "2026-08-01T10:00:01Z", "correlation_id": "golden-v0-informal-001"}, "expect": {"decision": "HUMAN_REVIEW", "reasons_include": ["INFORMAL_ECONOMY_REVIEW", "LOW_CONFIDENCE_GATE"]}}

  - {"kind": "evaluate", "name": "Informal sector applicant \u2014 HUMAN_REVIEW (shadow mode returns PASS)", "governance_mode": "shadow", "request": {"model_id": "credit-underwriting-v1", "model_version": "1.0.0", "purpose": "credit_decision", "consent": {"purpose_id": "credit_decision", "timestamp": "2026-08-01T10:00:00Z"}, "input": {"credit_score": 0, "income": 28000, "debt_ratio": 0.28, "loan_amount": 80000, "employment_years": 0, "informal_sector": true}, "confidence": 0.49, "decision_time": "2026-08-01T10:00:01Z", "correlation_id": "golden-v0-informal-001"}, "expect": {"decision": "PASS"}}

  - {"kind": "evaluate", "name": "Purpose mismatch on consent \u2014 BLOCK", "request": {"model_id": "credit-underwriting-v1", "model_version": "1.0.0", "purpose": "credit_decision", "consent": {"purpose_id": "marketing", "timestamp": "2026-08-01T10:00:00Z"}, "input": {"credit_score": 700, "debt_ratio": 0.3}, "confidence": 0.85, "decision_time": "2026-08-01T10:00:01Z", "correlation_id": "golden-v0-consent-001"}, "expect": {"decision": "BLOCK", "reasons_include": ["CONSENT_MISMATCH"]}}
  - {"kind": "evaluate", "name": "Purpose mismatch on consent \u2014 BLOCK (shadow mode returns PASS)", "governance_mode": "shadow", "request": {"model_id": "credit-underwriting-v1", "model_version": "1.0.0", "purpose": "credit_decision", "consent": {"purpose_id": "marketing", "timestamp": "2026-08-01T10:00:00Z"}, "input": {"credit_score": 700, "debt_ratio": 0.3}, "confidence": 0.85, "decision_time": "2026-08-01T10:00:01Z", "correlation_id": "golden-v0-consent-001"}, "expect": {"decision": "PASS"}}

