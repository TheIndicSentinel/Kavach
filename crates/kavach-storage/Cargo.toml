[package]
name = "kavach-storage"
description = "Postgres evidence chain and batch job persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tracing = { workspace = true }
kavach-domain = { workspace = true }
kavach-evaluate = { workspace = true }
kavach-evidence = { workspace = true }
kavach-ports = { workspace = true }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[features]
# Isolated-schema helpers for Postgres integration tests.
test-support = []

[dev-dependencies]
# The wire-level TLS test reads and writes a raw socket with a timeout.
tokio = { workspace = true, features = ["io-util", "time"] }
kavach-storage = { path = ".", features = ["test-support"] }
kavach-policy = { workspace = true }
serde_yaml.workspace = true
kavach-ports-testkit = { workspace = true }
kavach-keys = { workspace = true }
sha2.workspace = true

[lints]
workspace = true
