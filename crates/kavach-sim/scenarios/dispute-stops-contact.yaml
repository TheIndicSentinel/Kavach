# A dispute stops contact by every agent (ADR-012). Two compliant agents
# share three borrowers, so each borrower has two mandates. Before day 2's
# first slot, the first borrower's loan is disputed: one event revokes both
# mandates, and neither agent reaches that borrower again.
version: 1
name: dispute-stops-contact
description: A dispute revokes every agent's mandate for the loan in one event.
covers: ["Revocation by system-of-record event (ADR-012):"]   # SECURITY_PROPERTIES.md rows
seed: 13
days: 2
borrowers: 3
schedule: ["09:00", "12:00"]
agents:
  - type: compliant
    count: 2
assignment: shared
events:
  - { day: 2, at: "08:30", type: loan.disputed }
expect:
  violations: 0
  mismatches: 0
  leaks: 0
  allowed_at_least: 10
  blocked_at_least: { mandate_invalid: 2 }
