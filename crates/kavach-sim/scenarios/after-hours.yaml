# Past 19:00 IST: an eager agent keeps contacting after hours. The 18:55
# contacts are allowed; the 19:05 ones are blocked by the contact-hours
# floor (08:00 to 19:00 IST).
version: 1
name: after-hours
description: Contacts at 18:55 are allowed; at 19:05 they are blocked.
covers: ["Agent authorization core (library):"]   # SECURITY_PROPERTIES.md rows
seed: 11
days: 1
borrowers: 4
schedule: ["18:55", "19:05"]
agents:
  - type: eager
    behaviour:
      contacts_per_day: 2
      late_rate: 1.0
      extra_contact_rate: 0.0
      wrong_channel_rate: 0.0
expect:
  violations: 0
  mismatches: 0
  leaks: 0
  allowed_at_least: 4
  blocked_at_least:
    contact-hours-floor: 4
