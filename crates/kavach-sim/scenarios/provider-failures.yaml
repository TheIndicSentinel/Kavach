# The provider refuses one borrower's message (422: refused), errs on
# another's (500: unknown, since an error does not prove it was not sent),
# and loses the response for a third (unknown). Nothing is retried here.
version: 1
name: provider-failures
description: Provider refusals, errors and lost responses are recorded as such.
seed: 31
days: 1
borrowers: 5
schedule: ["10:00"]
agents:
  - type: compliant
provider_failures: { refuse: 1, error: 1, lose: 1 }
expect:
  violations: 0
  mismatches: 0
  leaks: 0
  allowed_at_least: 5
