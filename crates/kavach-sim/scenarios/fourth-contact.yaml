# The fourth contact of the day: an eager agent means to contact each
# borrower four times; the daily cap of three stops the fourth.
version: 1
name: fourth-contact
description: The daily cap (3 per borrower per IST day) blocks the fourth contact.
covers: ["Agent authorization core (library):"]   # SECURITY_PROPERTIES.md rows
seed: 13
days: 1
borrowers: 3
schedule: ["09:00", "10:00", "11:00", "12:00"]
agents:
  - type: eager
    behaviour:
      contacts_per_day: 4
      late_rate: 0.0
      extra_contact_rate: 0.0
      wrong_channel_rate: 0.0
expect:
  violations: 0
  mismatches: 0
  leaks: 0
  allowed_at_least: 9
  blocked_at_least:
    contact-daily-cap: 3
