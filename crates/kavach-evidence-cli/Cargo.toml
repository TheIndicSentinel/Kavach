[package]
name = "kavach-evidence-cli"
description = "The kavach-evidence command: verify evidence exports and write evidence bundles"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kavach-evidence"
path = "src/main.rs"

[dependencies]
kavach-evidence = { workspace = true }
kavach-ports = { workspace = true }
chrono.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Only for `export` and `checkpoints` (feature `export`).
kavach-keys = { workspace = true, optional = true }
kavach-storage = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# The bounded-memory test measures the whole process's heap, so it runs as
# a plain single-threaded program: no test harness, no other threads, and
# its figures are always printed.
[[test]]
name = "memory"
harness = false

[features]
default = ["export"]
# The commands that read a database: `export` and `checkpoints`. Without
# it (`--no-default-features`) the binary has no database or network code.
export = ["dep:kavach-keys", "dep:kavach-storage", "dep:tokio"]

[dev-dependencies]
kavach-domain = { workspace = true }
kavach-ports-testkit = { workspace = true }
kavach-storage = { workspace = true, features = ["test-support"] }
ed25519-dalek = { workspace = true }
# Measures peak heap use in the bounded-memory test (tests/memory.rs).
peak_alloc.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
